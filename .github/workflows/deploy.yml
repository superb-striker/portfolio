name: Deploy to Github Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write  # Required for the 'gh-pages' package to push changes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use the version matching your local environment
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # Faster and more reliable than 'npm install' for CI

      - name: Configure Git Identity
        run: |
          git config --global user.email "github-actions[bot]@://github.com"
          git config --global user.name "github-actions[bot]"

      - name: Set Authenticated Remote
        run: git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Deploy
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

