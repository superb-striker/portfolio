<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../src/css/css-reset.css" />
    <link rel="stylesheet" href="../src/css/style.css" />
    <link rel="icon" type="image/png" href="../res/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://kit.fontawesome.com/d5effce557.js" crossorigin="anonymous"></script>
    <title>Nipun's Terminal Portfolio</title>
  </head>
  <body>
    <canvas id="matrix-rain"></canvas>
    <main id="main">
      <div id="bars">
        <div id="bar-1"><span>NIPUN'S_MAINFRAME_v3.1.76</span><a class="visual-return" href="../">EXIT TO VISUAL MODE</a></div>
        <div id="bar-2"></div><div id="bar-3"></div><div id="bar-4"></div><div id="bar-5"></div>
      </div>
      <br />
      <div id="terminal">
        <div><span id="prompt"><span id="pre-user"></span>@<span id="pre-host"></span>:$ ~</span></div>
        <a id="write-lines"></a>
      </div>
      <div id="input-line">
        <div>
          <p id="password-input" style="display: none">Password: <input id="password-field" autocomplete="off" type="password" /></p>
          <p id="input-hidden"><span id="prompt"><span id="user"></span>@<span id="host"></span>:$ ~</span> <input id="user-input" type="text" enterkeyhint="enter" spellcheck="false" autocapitalize="none" autocomplete="off" aria-label="Terminal command" /></p>
        </div>
        <br />
      </div>
    </main>
    <div class="crt-overlay"></div>
    <script type="module" src="../src/styles.ts"></script>
    <script type="module" src="../src/main.ts"></script>
    <script type="module" src="../src/matrixRain.ts"></script>
  </body>
</html>
